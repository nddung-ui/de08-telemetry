username: admin
password: NokiaSrl1!
skip-verify: true
encoding: json_ietf

targets:
  172.20.20.3:57400:
  172.20.20.5:57400:

subscriptions:
  interface-stats:
    paths:
      - /interface/statistics
    stream-mode: sample
    sample-interval: 5s

  cpu-mem:
    paths:
      - /platform/control[slot=A]/cpu[index=all]/total
    stream-mode: sample
    sample-interval: 10s

outputs:
  prom:
    type: prometheus
    listen: :9273
    path: /metrics
    metric-prefix: gnmic
    append-subscription-name: true
    export-timestamps: true
    strings-as-labels: true
